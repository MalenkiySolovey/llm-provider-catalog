name: Validate provider catalog

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install pinned validator dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Verify catalog contract and detached signature
        run: python tools/verify_catalog.py
      - name: Run negative and compatibility tests
        run: python -m unittest discover -s tests -v
